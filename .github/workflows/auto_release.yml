name: auto release

# Vérifie la dernière version stable de Home Assistant Core et crée
# automatiquement les tags + releases manquants (toutes les 4h).
# Le tag est poussé avec un PAT (RELEASE_PAT) afin de déclencher build_images.yml
# (un tag poussé par le GITHUB_TOKEN par défaut ne déclenche aucun workflow).

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0

      - name: Check upstream HA Core and create missing releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          UPSTREAM_REPO: home-assistant/core
        run: |
          set -euo pipefail

          # Dernière version déjà taguée dans le fork (0.0.0 si aucune)
          git fetch --tags --quiet
          CURRENT=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          CURRENT=${CURRENT:-0.0.0}
          echo "Version courante du fork: $CURRENT"

          # Releases stables upstream (exclut les pre-releases/beta)
          UPSTREAM_VERSIONS=$(gh release list \
            --repo "$UPSTREAM_REPO" \
            --exclude-pre-releases \
            --exclude-drafts \
            --limit 100 \
            --json tagName \
            --jq '.[].tagName' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$')

          # Versions strictement supérieures à la courante, dans l'ordre croissant
          NEW_VERSIONS=$(for v in $UPSTREAM_VERSIONS; do
            top=$(printf '%s\n%s\n' "$CURRENT" "$v" | sort -V | tail -n1)
            if [ "$v" = "$top" ] && [ "$v" != "$CURRENT" ]; then
              echo "$v"
            fi
          done | sort -V)

          if [ -z "$NEW_VERSIONS" ]; then
            echo "Aucune nouvelle version. Rien à faire."
            exit 0
          fi

          echo "Nouvelles versions à publier:"
          echo "$NEW_VERSIONS"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for v in $NEW_VERSIONS; do
            if git rev-parse "$v" >/dev/null 2>&1; then
              echo "Tag $v existe déjà, on saute."
              continue
            fi

            # L'image de base ghcr.io/home-assistant/home-assistant:<v> est publiée
            # avec un délai après la release GitHub. On ne crée le tag que si elle
            # existe, sinon le build échoue. Réessai au prochain cron.
            GHCR_TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:home-assistant/home-assistant:pull" | jq -r .token)
            IMG_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GHCR_TOKEN" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              "https://ghcr.io/v2/home-assistant/home-assistant/manifests/$v")
            if [ "$IMG_CODE" != "200" ]; then
              echo "Image ghcr home-assistant:$v pas encore disponible (HTTP $IMG_CODE), report au prochain cron."
              continue
            fi

            echo "=== Création tag + release $v ==="
            printf 'Bump Home Assistant Core to %s\n\nUpstream release notes: https://github.com/%s/releases/tag/%s\n' \
              "$v" "$UPSTREAM_REPO" "$v" > notes.md
            git tag -a "$v" -F <(printf 'Home Assistant Core %s\n\nSee: https://github.com/%s/releases/tag/%s\n' \
              "$v" "$UPSTREAM_REPO" "$v")
            git push origin "$v"
            gh release create "$v" --title "$v" --notes-file notes.md
          done
